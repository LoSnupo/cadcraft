[package]
name = "dwg2iges"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Converts the 3D solids of DWG/DXF drawings to IGES 5.3 trimmed surfaces"
publish = false

# A standalone tool, not a member of the CADCraft workspace: it links acadrust directly
# (MPL-2.0, unmodified) to read the solids' ACIS data, which CADCraft does not model yet.
[workspace]

[dependencies]
acadrust = "=0.6.6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
opt-level = 3
lto = "thin"
