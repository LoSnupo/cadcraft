[package]
name = "cadcraft-iges"
description = "IGES 5.3 (trimmed surfaces) and STEP (closed solids) export of the 3D solids (ACIS data) of DWG/DXF drawings"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
chrono = { workspace = true }

# Reading DWG/DXF files and the solids' ACIS data: acadrust (MPL-2.0, used unmodified), only
# where it builds (not on the web, not on FreeBSD aarch64; see crates/io).
[target.'cfg(not(any(target_arch = "wasm32", all(target_os = "freebsd", target_arch = "aarch64"))))'.dependencies]
acadrust = "0.6.6"
